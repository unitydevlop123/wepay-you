<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1200" height="600" fill="url(#bg1)"/>
  
  <!-- Professional businesswoman silhouette -->
  <g transform="translate(800, 150)">
    <!-- Head -->
    <ellipse cx="50" cy="40" rx="35" ry="40" fill="rgba(255,255,255,0.9)"/>
    <!-- Body -->
    <rect x="20" y="75" width="60" height="120" rx="30" fill="rgba(255,255,255,0.8)"/>
    <!-- Arms -->
    <ellipse cx="10" cy="100" rx="15" ry="40" fill="rgba(255,255,255,0.7)"/>
    <ellipse cx="90" cy="100" rx="15" ry="40" fill="rgba(255,255,255,0.7)"/>
    <!-- Professional attire details -->
    <rect x="25" y="80" width="50" height="15" fill="rgba(255,255,255,0.6)"/>
    <circle cx="50" cy="85" r="3" fill="rgba(255,255,255,0.9)"/>
  </g>
  
  <!-- Financial success elements -->
  <g transform="translate(200, 200)">
    <!-- Chart/Graph -->
    <rect x="0" y="0" width="300" height="200" fill="rgba(255,255,255,0.1)" rx="10"/>
    <polyline points="20,160 80,120 140,80 200,40 260,20" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4"/>
    <circle cx="20" cy="160" r="6" fill="#4CAF50"/>
    <circle cx="80" cy="120" r="6" fill="#4CAF50"/>
    <circle cx="140" cy="80" r="6" fill="#4CAF50"/>
    <circle cx="200" cy="40" r="6" fill="#4CAF50"/>
    <circle cx="260" cy="20" r="6" fill="#4CAF50"/>
  </g>
  
  <!-- Money symbols -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="25" fill="rgba(255,215,0,0.8)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="white">₦</text>
  </g>
  
  <g transform="translate(150, 400)">
    <circle cx="0" cy="0" r="20" fill="rgba(76,175,80,0.8)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">₦</text>
  </g>
  
  <!-- Professional elements -->
  <g transform="translate(50, 300)">
    <rect x="0" y="0" width="80" height="50" fill="rgba(255,255,255,0.2)" rx="5"/>
    <rect x="10" y="10" width="60" height="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="10" y="20" width="40" height="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="10" y="30" width="50" height="3" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>