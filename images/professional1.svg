<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="professionalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="600" fill="url(#professionalBg)"/>
  
  <!-- Professional Nigerian Businesswoman -->
  <g transform="translate(200, 150)">
    <!-- Head/Face -->
    <ellipse cx="0" cy="0" rx="45" ry="55" fill="#8B4513" filter="url(#shadow)"/>
    
    <!-- Hair (professional style) -->
    <ellipse cx="0" cy="-30" rx="50" ry="35" fill="#2F1B14"/>
    <path d="M-45,-20 Q-35,-45 -15,-40 Q5,-42 25,-38 Q45,-35 45,-15 Q45,0 35,5 Q15,8 0,5 Q-20,8 -45,0 Z" fill="#2F1B14"/>
    
    <!-- Professional blazer -->
    <rect x="-55" y="50" width="110" height="160" rx="15" fill="#1a365d"/>
    
    <!-- White blouse collar -->
    <polygon points="-25,55 25,55 20,75 -20,75" fill="white"/>
    
    <!-- Arms in professional pose -->
    <ellipse cx="-70" cy="100" rx="20" ry="50" fill="#8B4513"/>
    <ellipse cx="70" cy="100" rx="20" ry="50" fill="#8B4513"/>
    
    <!-- Professional jacket sleeves -->
    <ellipse cx="-70" cy="100" rx="25" ry="55" fill="#1a365d"/>
    <ellipse cx="70" cy="100" rx="25" ry="55" fill="#1a365d"/>
    
    <!-- Professional necklace/jewelry -->
    <circle cx="0" cy="65" r="8" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- Office background elements -->
  <g opacity="0.3">
    <!-- Office building through window -->
    <rect x="50" y="50" width="80" height="120" fill="#4a5568" opacity="0.2"/>
    <rect x="270" y="40" width="90" height="140" fill="#4a5568" opacity="0.2"/>
    
    <!-- Professional office items -->
    <rect x="20" y="450" width="360" height="80" fill="#2d3748" opacity="0.1"/>
    <rect x="40" y="470" width="60" height="40" fill="#4a5568" opacity="0.3"/>
  </g>
  
  <!-- Professional title overlay -->
  <text x="200" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">
    Executive Director
  </text>
  <text x="200" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">
    Financial Services
  </text>
</svg>